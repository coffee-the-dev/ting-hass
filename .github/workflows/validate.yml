name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "43 5 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Use the official image directly: the action wrapper pulls a floating tag.
      # ghcr.io/hacs/action:main, resolved 2026-09-21.
      - name: Validate HACS repository
        uses: docker://ghcr.io/hacs/action@sha256:dc92fdad2f6ffbe74bffb7269d781ea8e064f52d9bb486cdf3925d74e7ab6ebf
        env:
          INPUT_CATEGORY: integration
          INPUT_COMMENT: "false"
          INPUT_GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY_REF: ${{ github.event.pull_request.head.sha || github.sha }}

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ghcr.io/home-assistant/hassfest:latest, resolved 2026-09-21.
      - name: Validate Home Assistant integration
        uses: docker://ghcr.io/home-assistant/hassfest@sha256:66b55a8ce14cdcf0c200dd4dab1f3228ac8d3f6e0404ec710a0d8a79b296eba4
